schema_version: "1.0"

preset:
  id: "specdd-bridge"
  name: "Boundary Spec Kit Task Integration"
  version: "0.1.0"
  description: "Add exact Boundary write metadata guidance to Spec Kit task generation."
  author: "Boundary contributors"
  repository: "https://github.com/specdd/specdd"
  license: "Apache-2.0"

requires:
  speckit_version: "==1.0.10"
  extensions:
    - id: specdd
      version: "==0.1.0"
      required: true

provides:
  templates:
    - type: "command"
      name: "speckit.tasks"
      file: "commands/tasks.md"
      description: "Record exact implementation Writes metadata for Boundary authorization."
      strategy: "append"

tags:
  - boundary
  - architecture
  - workflow
