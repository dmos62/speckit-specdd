schema_version: "1.0"

extension:
  id: specdd
  name: "SpecDD Bridge"
  version: "0.1.0"
  description: "Project SpecDD authority into Spec Kit feature workflows without duplicating persistent system contracts."
  author: "SpecDD contributors"
  repository: "https://github.com/specdd/specdd"
  license: "Apache-2.0"
  homepage: "https://specdd.ai"
  category: integration
  effect: read-write

requires:
  speckit_version: "==1.0.7"
  tools:
    - name: specdd
      version: "==1.1.1"
      required: true

provides:
  commands:
    - name: speckit.specdd.context
      file: commands/context.md
      description: "Build or refresh the active feature's derived SpecDD Change Boundary."
    - name: speckit.specdd.validate
      file: commands/validate.md
      description: "Validate Spec Kit task write scope against the current SpecDD Change Boundary."

tags:
  - specdd
  - integration
  - architecture
